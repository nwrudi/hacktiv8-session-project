<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini AI Chatbot</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
      <a href="index.html" style="text-decoration: none; color: #0d6efd; font-size: 14px; font-weight: 500;">← Kembali
        ke Website</a>
      <span
        style="font-size: 12px; color: #10b981; font-weight: bold; background: #e8f5e9; padding: 4px 10px; border-radius: 12px;">●
        Online</span>
    </div>
    <h1 style="margin-bottom: 5px;">NatureBound AI Assistant</h1>
    <p style="text-align: center; color: #666; font-size: 13px; margin-top: 0; margin-bottom: 20px;">Tanyakan seputar
      rental alat camping, guide gunung, dan info hub cabang kami 🏕️</p>
    <div id="chat-box" class="chat-box"></div>
    <form id="chat-form">
      <input type="text" id="user-input" placeholder="Ketik pesan Anda di sini..." autocomplete="off" required />
      <button type="submit">Send</button>
    </form>
  </div>
  <script src="script.js"></script>
</body>

</html>
